<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ivory:#fbf7f2;--blush:#f3dcd6;--rose:#c98f8b;--sage:#8a9a85;--ink:#42352f;--gold:#b38b5d;--line:#eadfd3}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--ivory);color:var(--ink);font:300 16px/1.75 Jost,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:400;margin:0}
.script{font-family:'Great Vibes',cursive;color:var(--rose)}
.eyebrow{font-size:.72rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold)}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:1.4rem;padding:.9rem 1rem;background:rgba(251,247,242,.92);backdrop-filter:blur(8px);transform:translateY(-100%);transition:transform .5s;border-bottom:1px solid var(--line)}
nav.show{transform:none}nav a{font-size:.68rem;letter-spacing:.25em;text-transform:uppercase;color:var(--ink);cursor:pointer}
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2rem 1.5rem 8rem;overflow:hidden;
 background:radial-gradient(circle at 20% 15%,#f9e6e0 0,transparent 45%),radial-gradient(circle at 85% 30%,#e5ebe0 0,transparent 45%),linear-gradient(#fbf1ea,#fbf7f2)}
.hero .script{font-size:clamp(1.8rem,7vw,2.6rem);margin:0 0 .3rem}
.hero h1{font-size:clamp(3.4rem,15vw,8rem);line-height:1;letter-spacing:.02em}
.hero h1 i{font-family:'Great Vibes',cursive;color:var(--rose);font-size:.6em;padding:0 .15em}
.hero .date{margin-top:1.4rem;font-family:'Cormorant Garamond',serif;font-size:clamp(1.2rem,4vw,1.7rem);letter-spacing:.15em}
.hero .place{margin-top:.2rem;font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;opacity:.75}
.btn{display:inline-block;margin-top:2rem;padding:.95rem 2.4rem;border:1px solid var(--gold);color:var(--gold);background:transparent;font:400 .72rem Jost;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;transition:all .4s}
.btn:hover,.btn.fill{background:var(--gold);color:#fff}.btn.fill:hover{background:#9c7547}
.hills{position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none}
.hero>*:not(.hills){opacity:0;animation:up 1.2s ease forwards}
.hero>*:nth-child(1){animation-delay:.2s}.hero>*:nth-child(2){animation-delay:.5s}.hero>*:nth-child(3){animation-delay:.8s}.hero>*:nth-child(4){animation-delay:1.1s}.hero>*:nth-child(5){animation-delay:1.4s}.hero>*:nth-child(6){animation-delay:1.7s}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
section{padding:5rem 1.5rem;max-width:860px;margin:0 auto;text-align:center}
section h2{font-size:clamp(2.2rem,8vw,3.2rem);margin:.4rem 0 1rem}
.orn{display:flex;align-items:center;justify-content:center;gap:.8rem;color:var(--gold);margin:1.2rem 0}.orn:before,.orn:after{content:"";width:60px;height:1px;background:var(--gold);opacity:.6}
.count{display:flex;justify-content:center;gap:clamp(.8rem,4vw,2.2rem);margin-top:1.5rem}.count div{min-width:64px}.count b{display:block;font:400 clamp(2rem,9vw,3.2rem)/1 'Cormorant Garamond',serif}.count span{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.band{max-width:none;background:linear-gradient(#f6e6e1,#f3dcd6 120%)}.band>div{max-width:860px;margin:0 auto}
.cards{display:grid;gap:1.2rem;margin-top:2rem}@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.card{background:#fff;border:1px solid var(--line);padding:2rem 1.5rem;box-shadow:0 10px 30px rgba(120,80,60,.06)}
.card h3{font-size:1.7rem}.card .eyebrow{display:block;margin-bottom:.5rem}
.timeline{text-align:left;max-width:440px;margin:2rem auto 0;border-left:1px solid var(--gold);padding-left:1.6rem}
.timeline div{position:relative;margin-bottom:1.5rem}.timeline div:before{content:"";position:absolute;left:-2.05rem;top:.55rem;width:11px;height:11px;border-radius:50%;background:var(--rose);border:2px solid var(--ivory)}
.timeline b{font:500 1.35rem 'Cormorant Garamond',serif;display:block}
a.link{color:var(--gold);border-bottom:1px solid var(--gold);text-decoration:none}
.rsvp{max-width:560px}
.panel{background:#fff;border:1px solid var(--line);padding:2rem 1.5rem;text-align:left;box-shadow:0 20px 50px rgba(120,80,60,.08)}
label{display:block;margin:1.1rem 0 .35rem;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
input,select,textarea{width:100%;padding:.9rem 1rem;border:1px solid var(--line);background:var(--ivory);font:inherit;color:var(--ink);border-radius:2px;outline:0;transition:border .3s}
input:focus,select:focus,textarea:focus{border-color:var(--rose)}
#results{list-style:none;padding:0;margin:.6rem 0 0}#results li{padding:1rem;border:1px solid var(--line);margin-top:-1px;cursor:pointer;background:#fff;font:400 1.2rem 'Cormorant Garamond',serif;transition:all .3s;animation:up .4s ease}#results li:hover{background:var(--blush);padding-left:1.4rem}
.choice{display:grid;gap:.6rem}.choice label{margin:0;padding:1rem;border:1px solid var(--line);display:flex;gap:.7rem;align-items:center;cursor:pointer;text-transform:none;letter-spacing:0;font-size:1rem;color:var(--ink)}.choice input{width:auto}.choice label:has(input:checked){border-color:var(--rose);background:#fdf3f1}
.step{animation:up .6s ease}.small{font-size:.85rem;opacity:.75}.err{color:#a33}
.linkbtn{background:none;border:0;color:var(--gold);cursor:pointer;font:inherit;margin-left:.8rem;text-decoration:underline}
.done h3{font:400 3rem 'Great Vibes',cursive;color:var(--rose);text-align:center}.done{text-align:center}
.reveal{opacity:0;transform:translateY(34px);transition:opacity 1s ease,transform 1s ease}.reveal.in{opacity:1;transform:none}
footer{padding:3rem 1.5rem 4rem;text-align:center;background:var(--blush)}footer .script{font-size:2.4rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero>*,.reveal{opacity:1!important;transform:none!important}}
</style></head><body>
<nav id="nav"><a data-to="story">Us</a><a data-to="details">Details</a><a data-to="venue">Venue</a><a data-to="rsvp">RSVP</a></nav>
<header class="hero">
 <p class="script">Together with their families</p>
 <h1 id="names"></h1>
 <p class="date" id="date"></p>
 <p class="place" id="place"></p>
 <button class="btn" data-to="rsvp">RSVP</button>
 <svg class="hills" viewBox="0 0 800 150" preserveAspectRatio="none"><path d="M0 110 Q120 60 240 100 T480 90 T800 100 V150 H0Z" fill="#dfe6da"/><path d="M0 130 Q150 90 300 125 T600 120 T800 125 V150 H0Z" fill="#c9d4c3"/>
 <g fill="#9aab94"><path d="M60 125l10-45 10 45zM90 128l8-35 8 35zM700 124l10-48 10 48zM735 126l9-38 9 38zM400 122l7-30 7 30z"/></g></svg>
</header>
<section id="story" class="reveal"><p class="eyebrow">Save the date</p><h2 id="headline"></h2><div class="orn">&#10084;</div><p id="intro"></p>
 <div class="count" id="count"></div></section>
<div class="band"><section id="details" class="reveal"><p class="eyebrow">The celebration</p><h2>Details</h2>
 <div class="cards" id="cards"></div>
 <div class="timeline" id="timeline"></div></section></div>
<section id="venue" class="reveal"><p class="eyebrow">Where</p><h2 id="vname"></h2><div class="orn">&#10049;</div>
 <p id="vtext"></p><p><a class="link" id="map" target="_blank" rel="noopener">View on Google Maps</a></p>
 <div class="cards" id="travel"></div></section>
<section id="rsvp" class="rsvp reveal"><p class="eyebrow">Kindly reply</p><h2>RSVP</h2>
 <div class="panel">
  <div id="step1" class="step"><label for="q" style="margin-top:0">Search your name</label>
   <input id="q" type="search" autocomplete="off" placeholder="Type your first or last name">
   <ul id="results"></ul><p id="none" class="small" hidden></p></div>
  <form id="step2" class="step" hidden>
   <p style="font:400 1.6rem 'Cormorant Garamond',serif;margin:0">Welcome, <span id="who"></span></p>
   <p class="small" id="already" hidden>You already replied. Submitting again will update your answer.</p>
   <div class="choice" style="margin-top:1rem"><label><input type="radio" name="att" value="yes" checked> Joyfully accepts</label><label><input type="radio" name="att" value="no"> Regretfully declines</label></div>
   <div id="cntwrap"><label for="cnt">Guests attending (including you)</label><select id="cnt"></select></div>
   <label for="email">Email address</label><input id="email" type="email" required placeholder="you@example.com">
   <label for="notes">Dietary needs or a note (optional)</label><textarea id="notes" rows="3"></textarea>
   <div style="text-align:center"><button class="btn fill" type="submit" id="send">Send RSVP</button><br><button type="button" class="linkbtn small" id="back">Not you? Search again</button></div>
   <p class="err" id="err" hidden></p></form>
  <div id="done" class="step done" hidden><h3>Thank you</h3><p>Your RSVP is in. We'll email you the details soon.</p></div>
 </div></section>
<footer><p class="script" id="fnames"></p><p class="small" id="contact"></p></footer>
<script>
window.WEDDING={
 apiUrl:"https://script.google.com/macros/s/AKfycbxiy6zhKInn70xzM6M52AmYpQTrusa5lkmekYNRXVZiiMkWH3vZ8o8x7EJg3uUCIhsd/exec",
 names:["Alex","Jordan"],
 dateLine:"Saturday, June 12, 2027", dateISO:"2027-06-12T16:00:00+07:00",
 place:"Dalat, Vietnam",
 headline:"We're getting married",
 intro:"We would be honored to celebrate with you among the pines of Dalat. Find your name below to let us know you're coming.",
 events:[["Ceremony","4:00 PM","Garden ceremony at the villas"],["Reception","6:00 PM","Dinner, toasts and dancing"]],
 timeline:[["3:30 PM","Guests arrive"],["4:00 PM","Ceremony"],["5:00 PM","Cocktails in the gardens"],["6:00 PM","Dinner and reception"],["9:00 PM","Dancing under the stars"]],
 venue:"Ana Mandara Villas Dalat Resort & Spa",
 venueText:"Le Lai Street, Ward 5, Dalat, Lam Dong, Vietnam. A heritage villa resort beneath the pine hills.",
 mapUrl:"https://www.google.com/maps/search/?api=1&query=Ana+Mandara+Villas+Dalat+Resort+%26+Spa",
 travel:[["Getting there","Fly into Lien Khuong Airport (DLI) or take the road from Ho Chi Minh City."],["Where to stay","Rooms are at the villas. More details will follow by email once you RSVP."]],
 contact:"Questions? Email us at you@example.com"
};
const C=window.WEDDING,$=id=>document.getElementById(id);let sel=null,timer;
document.title=C.names.join(" & ")+" - Wedding";
$('names').innerHTML=C.names[0]+'<i>&amp;</i>'+C.names[1];$('fnames').textContent=C.names.join(" & ");
$('date').textContent=C.dateLine;$('place').textContent=C.venue+" · "+C.place;$('headline').textContent=C.headline;$('intro').textContent=C.intro;
$('vname').textContent=C.venue;$('vtext').textContent=C.venueText;$('map').href=C.mapUrl;$('contact').textContent=C.contact;
$('cards').innerHTML=C.events.map(e=>'<div class="card"><span class="eyebrow">'+e[1]+'</span><h3>'+e[0]+'</h3><p>'+e[2]+'</p></div>').join('');
$('timeline').innerHTML=C.timeline.map(t=>'<div><b>'+t[0]+'</b>'+t[1]+'</div>').join('');
$('travel').innerHTML=C.travel.map(e=>'<div class="card"><h3>'+e[0]+'</h3><p>'+e[1]+'</p></div>').join('');
function tick(){const d=new Date(C.dateISO)-new Date();if(d<0){$('count').innerHTML='';return}
 const v=[[Math.floor(d/864e5),'Days'],[Math.floor(d/36e5)%24,'Hours'],[Math.floor(d/6e4)%60,'Minutes'],[Math.floor(d/1e3)%60,'Seconds']];
 $('count').innerHTML=v.map(x=>'<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')}
tick();setInterval(tick,1000);
document.querySelectorAll('[data-to]').forEach(a=>a.onclick=()=>$(a.dataset.to).scrollIntoView({behavior:'smooth'}));
const nav=$('nav');addEventListener('scroll',()=>nav.classList.toggle('show',scrollY>window.innerHeight*.6),{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,300)});
const API=window.WEDDING.apiUrl;
function search(){const q=$('q').value.trim();$('none').hidden=true;$('results').innerHTML='';if(q.length<2)return;
 fetch(API+'?action=search&q='+encodeURIComponent(q)).then(r=>r.json()).then(r=>{$('results').innerHTML='';r.results.forEach(g=>{const li=document.createElement('li');li.textContent=g.name;li.onclick=()=>pick(g);$('results').appendChild(li)});
  $('none').textContent='No match. Try just your first or last name, or contact us below.';$('none').hidden=r.results.length>0})
 .catch(()=>{$('none').textContent='Could not reach the server. Please try again.';$('none').hidden=false})}
function show(id){['step1','step2','done'].forEach(s=>$(s).hidden=s!==id)}
function pick(g){sel=g;show('step2');$('who').textContent=g.name;$('already').hidden=!g.responded;
 $('cnt').innerHTML=Array.from({length:g.max},(_,i)=>'<option>'+(i+1)+'</option>').join('');$('cnt').value=g.max;$('cntwrap').hidden=false}
document.querySelectorAll('[name=att]').forEach(r=>r.onchange=()=>{$('cntwrap').hidden=document.querySelector('[name=att]:checked').value==='no'});
$('back').onclick=()=>show('step1');
$('step2').addEventListener('submit',e=>{e.preventDefault();$('err').hidden=true;$('send').disabled=true;
 const fail=m=>{$('err').textContent='Something went wrong: '+m;$('err').hidden=false;$('send').disabled=false};
 fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({id:sel.id,name:sel.name,attending:document.querySelector('[name=att]:checked').value,count:$('cnt').value,email:$('email').value,notes:$('notes').value})})
 .then(r=>r.json()).then(r=>{if(!r.ok)return fail(r.error);show('done')}).catch(x=>fail(x.message||x))});
</script></body></html>
