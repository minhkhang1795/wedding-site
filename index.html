  thanksTitle:"Thank you", thanksText:"Your RSVP is in. We'll email you the details soon.",
  genericError:"Something went wrong: ", countUnits:["Days","Hours","Minutes","Seconds"]
 }
};
const C=window.WEDDING,$=id=>document.getElementById(id);let sel=null,timer;
const T=C.text;
for(const id of ["navStory","navDetails","navVenue","navRsvp","heroTagline","heroButton","storyEyebrow","detailsEyebrow","detailsTitle","venueEyebrow","rsvpEyebrow","rsvpTitle","searchLabel","welcomePrefix","acceptText","declineText","countLabel","emailLabel","notesLabel","send","back","thanksTitle","thanksText"]){$(id).textContent=T[id]}
$('already').textContent=T.already;$('map').textContent=T.mapLink;$('q').placeholder=T.searchPlaceholder;$('email').placeholder=T.emailPlaceholder;
document.title=C.names.join(" & ")+" - Wedding";
$('names').innerHTML='<span>'+C.names[0]+'</span><i>&amp;</i><span>'+C.names[1]+'</span>';$('fnames').textContent=C.names.join(" & ");
$('date').textContent=C.dateLine;$('place').textContent=C.venue+" · "+C.place;$('headline').textContent=C.headline;$('intro').textContent=C.intro;
$('vname').textContent=C.venue;$('vtext').textContent=C.venueText;$('map').href=C.mapUrl;$('contact').textContent=C.contact;
$('cards').innerHTML=C.events.map(e=>'<div class="card"><span class="eyebrow">'+e[1]+'</span><h3>'+e[0]+'</h3><p>'+e[2]+'</p></div>').join('');
$('timeline').innerHTML=C.timeline.map(t=>'<div><b>'+t[0]+'</b>'+t[1]+'</div>').join('');
$('travel').innerHTML=C.travel.map(e=>'<div class="card"><h3>'+e[0]+'</h3><p>'+e[1]+'</p></div>').join('');
$('heroPhoto').src=C.photos.heroDesktop;$('heroPhoto').alt=C.photos.gallery[2].alt;$('heroMobile').srcset=C.photos.heroMobile;
$('venuePhoto').src=C.photos.venue;$('venuePhoto').alt='Ana Mandara Villas Dalat Resort beneath the pine hills';
$('photoGrid').innerHTML=C.photos.gallery.map(p=>'<figure><img src="'+p.src+'" alt="'+p.alt+'" width="'+p.width+'" height="'+p.height+'" loading="lazy" decoding="async"></figure>').join('');
['galleryEyebrow','galleryTitle','galleryText'].forEach(id=>$(id).textContent=T[id]);
function tick(){const d=new Date(C.dateISO)-new Date();if(d<0){$('count').innerHTML='';return}
 const v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
 if(!$('count').children.length)$('count').innerHTML=v.map((x,i)=>'<div><b></b><span>'+T.countUnits[i]+'</span></div>').join('');
 [...$('count').children].forEach((el,i)=>{const b=el.firstChild,t=String(v[i]);if(b.textContent!==t){b.textContent=t;b.classList.remove('flip');void b.offsetWidth;b.classList.add('flip')}})}
tick();setInterval(tick,1000);
document.querySelectorAll('[data-to]').forEach(a=>a.onclick=()=>$(a.dataset.to).scrollIntoView({behavior:'smooth'}));
const nav=$('nav');addEventListener('scroll',()=>nav.classList.toggle('show',scrollY>document.getElementById('hero').offsetHeight-window.innerHeight*.6),{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,300)});
const API=window.WEDDING.apiUrl;
function search(){const q=$('q').value.trim();$('none').hidden=true;$('results').innerHTML='';if(q.length<2)return;
 fetch(API+'?action=search&q='+encodeURIComponent(q)).then(r=>r.json()).then(r=>{$('results').innerHTML='';r.results.forEach(g=>{const li=document.createElement('li');li.textContent=g.name;li.onclick=()=>pick(g);$('results').appendChild(li)});
  $('none').textContent=T.noMatch;$('none').hidden=r.results.length>0})
 .catch(()=>{$('none').textContent=T.serverError;$('none').hidden=false})}
function show(id){['step1','step2','done'].forEach(s=>$(s).hidden=s!==id)}
function pick(g){sel=g;show('step2');$('who').textContent=g.name;$('already').hidden=!g.responded;
 $('cnt').innerHTML=Array.from({length:g.max},(_,i)=>'<option>'+(i+1)+'</option>').join('');$('cnt').value=g.max;$('cntwrap').hidden=false}
document.querySelectorAll('[name=att]').forEach(r=>r.onchange=()=>{$('cntwrap').hidden=document.querySelector('[name=att]:checked').value==='no'});
$('back').onclick=()=>show('step1');
$('step2').addEventListener('submit',e=>{e.preventDefault();$('err').hidden=true;$('send').disabled=true;
 const fail=m=>{$('err').textContent=T.genericError+m;$('err').hidden=false;$('send').disabled=false};
 fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({id:sel.id,name:sel.name,attending:document.querySelector('[name=att]:checked').value,count:$('cnt').value,email:$('email').value,notes:$('notes').value})})
 .then(r=>r.json()).then(r=>{if(!r.ok)return fail(r.error);show('done')}).catch(x=>fail(x.message||x))});

// Theater-curtain opening. Wait for the hero image before revealing the curtain.
(function(){
const curtain=$('curtain'),photo=$('heroPhoto');
const removeCurtain=()=>curtain&&curtain.remove();
if(matchMedia('(prefers-reduced-motion: reduce)').matches){removeCurtain();return}
const begin=()=>{
 if(!curtain)return;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  curtain.classList.add('opening');
  curtain.addEventListener('animationend',e=>{if(e.target===curtain.querySelector('.curtain-left'))removeCurtain()},{once:true});
  setTimeout(removeCurtain,5200);
 }));
};
if(photo.complete&&photo.naturalWidth){(photo.decode?photo.decode().catch(()=>{}):Promise.resolve()).then(begin)}
else{photo.addEventListener('load',()=> (photo.decode?photo.decode().catch(()=>{}):Promise.resolve()).then(begin),{once:true});photo.addEventListener('error',begin,{once:true});}
})();
const pageNav=$('nav');addEventListener('scroll',()=>pageNav.classList.toggle('show',scrollY>document.getElementById('hero').offsetHeight-window.innerHeight*.6),{passive:true});
addEventListener('scroll',()=>{$('prog').style.transform='scaleX('+scrollY/(document.documentElement.scrollHeight-innerHeight)+')'},{passive:true});
</script></body></html>
