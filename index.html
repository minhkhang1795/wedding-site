    <style>
      :root {
  --ivory: #fbf4e8;
  --blush: #f2dcc0;
  --rose: #b5532a;
  --sage: #2f5a43;
  --ink: #3a281c;
  --gold: #c0722c;
  --line: #e8d3b8;
  --pine: #1c382b;
  --pine2: #2f5a43;
  --amber: #d98a2b;
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: var(--ivory);
  color: var(--ink);
  font:
    300 16px/1.75 Jost,
    sans-serif;
  overflow-x: hidden;
}
h1,
h2,
h3 {
  font-family: "Cormorant Garamond", serif;
  font-weight: 400;
  margin: 0;
}
.script {
  font-family: "Great Vibes", cursive;
  color: var(--rose);
}
.eyebrow {
  font-size: 0.72rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--gold);
}
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: flex;
  justify-content: center;
  gap: 1.4rem;
  padding: 0.9rem 1rem;
  background: rgba(251, 247, 242, 0.92);
  backdrop-filter: blur(8px);
  transform: translateY(-100%);
  transition: transform 0.5s;
  border-bottom: 1px solid var(--line);
}
nav.show {
  transform: none;
}
nav a {
  font-size: 0.68rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--ink);
  cursor: pointer;
}
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 2rem 1.5rem 8rem;
  overflow: hidden;
  background:
    radial-gradient(circle at 20% 15%, #f9e6e0 0, transparent 45%),
    radial-gradient(circle at 85% 30%, #e5ebe0 0, transparent 45%),
    linear-gradient(#fbf1ea, #fbf7f2);
}
.hero .script {
  font-size: clamp(1.8rem, 7vw, 2.6rem);
  margin: 0 0 0.3rem;
}
.hero h1 {
  font-size: clamp(3.4rem, 15vw, 8rem);
  line-height: 1;
  letter-spacing: 0.02em;
}
.hero h1 i {
  font-family: "Great Vibes", cursive;
  color: var(--rose);
  font-size: 0.6em;
  padding: 0 0.15em;
}
.hero .date {
  margin-top: 1.4rem;
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(1.2rem, 4vw, 1.7rem);
  letter-spacing: 0.15em;
}
.hero .place {
  margin-top: 0.2rem;
  font-size: 0.8rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  opacity: 0.75;
}
.btn {
  display: inline-block;
  margin-top: 2rem;
  padding: 0.95rem 2.4rem;
  border: 1px solid var(--gold);
  color: var(--gold);
  background: transparent;
  font: 400 0.72rem Jost;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.4s;
}
.btn:hover,
.btn.fill {
  background: var(--gold);
  color: #fff;
}
.btn.fill:hover {
  background: #9a5420;
}
.hills {
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 150px;
  pointer-events: none;
}
@keyframes up {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
section {
  padding: 5rem 1.5rem;
  max-width: 860px;
  margin: 0 auto;
  text-align: center;
}
section h2 {
  font-size: clamp(2.2rem, 8vw, 3.2rem);

}
.orn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.8rem;
  color: var(--gold);
  margin: 1.2rem 0;
}
.orn:before,
.orn:after {
  content: "";
  width: 60px;
  height: 1px;
  background: var(--gold);
  opacity: 0.6;
}
.orn-icon {
  display: block;
  width: 18px;
  height: 18px;
  flex: none;
  color: inherit;
}
.count {
  display: flex;
  justify-content: center;
  gap: clamp(0.8rem, 4vw, 2.2rem);
  margin-top: 1.5rem;
}
.count div {
  min-width: 64px;
}
.count b {
  display: block;

    400 clamp(2rem, 9vw, 3.2rem)/1 "Cormorant Garamond",

}
.count span {
  font-size: 0.62rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold);
}
.band {
  max-width: none;
  background: linear-gradient(#f7e6cc, #f0d3aa 120%);
}
.band > div {
  max-width: 860px;
  margin: 0 auto;
}
.cards {
  display: grid;
  gap: 1.2rem;
  margin-top: 2rem;
}
@media (min-width: 640px) {
  .cards {
    grid-template-columns: 1fr 1fr;
  }
}
.card {
  background: #fffaf1;
  border: 1px solid var(--line);
  padding: 2rem 1.5rem;
  box-shadow: 0 10px 30px rgba(120, 80, 60, 0.06);
}
.card h3 {
  font-size: 1.7rem;
}
.card .eyebrow {
  display: block;
  margin-bottom: 0.5rem;
}
.timeline {
  text-align: left;
  max-width: 440px;
  margin: 2rem auto 0;
  border-left: 1px solid var(--gold);
  padding-left: 1.6rem;
}
.timeline div {
  position: relative;
  margin-bottom: 1.5rem;
}
.timeline div:before {
  content: "";
  position: absolute;
  left: -2.05rem;
  top: 0.55rem;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--rose);
  border: 2px solid var(--ivory);
}
.timeline b {
  font:
    500 1.35rem "Cormorant Garamond",
    serif;
  display: block;
}
a.link {
  color: var(--gold);
  border-bottom: 1px solid var(--gold);
  text-decoration: none;
}
.rsvp {
  max-width: 560px;
}
.panel {
  background: #fff;
  border: 1px solid var(--line);
  padding: 2rem 1.5rem;
  text-align: left;
  box-shadow: 0 20px 50px rgba(120, 80, 60, 0.08);
}
label {
  display: block;
  margin: 1.1rem 0 0.35rem;
  font-size: 0.72rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold);
}
input,
select,
textarea {
  width: 100%;
  padding: 0.9rem 1rem;
  border: 1px solid var(--line);
  background: var(--ivory);
  font: inherit;
  color: var(--ink);
  border-radius: 2px;
  outline: 0;
  transition: border 0.3s;
}
input:focus,
select:focus,
textarea:focus {
  border-color: var(--rose);
}
#results {
  list-style: none;
  padding: 0;
  margin: 0.6rem 0 0;
}
#results li {
  padding: 1rem;
  border: 1px solid var(--line);
  margin-top: -1px;
  cursor: pointer;
  background: #fff;
  font:
    400 1.2rem "Cormorant Garamond",
    serif;
  transition: all 0.3s;
  animation: up 0.4s ease;
}
#results li:hover {
  background: var(--blush);
  padding-left: 1.4rem;
}
.choice {
  display: grid;
  gap: 0.6rem;
}
.choice label {
  margin: 0;
  padding: 1rem;
  border: 1px solid var(--line);
  display: flex;
  gap: 0.7rem;
  align-items: center;
  cursor: pointer;
  text-transform: none;
  letter-spacing: 0;
  font-size: 1rem;
  color: var(--ink);
}
.choice input {
  width: auto;
}
.choice label:has(input:checked) {
  border-color: var(--rose);

}
.step {
  animation: up 0.6s ease;
}
.small {
  font-size: 0.85rem;
  opacity: 0.75;
}
.err {
  color: #a33;
}
.linkbtn {
  background: none;
  border: 0;
  color: var(--gold);
  cursor: pointer;
  font: inherit;
  margin-left: 0.8rem;
  text-decoration: underline;
}
.done h3 {
  font:
    400 3rem "Great Vibes",
    cursive;
  color: var(--rose);
  text-align: center;
}
.done {
  text-align: center;
}
.reveal {
  opacity: 0;
  transform: translateY(34px);
  transition:
    opacity 1s ease,
    transform 1s ease;
}
.reveal.in {
  opacity: 1;
  transform: none;
}
footer {
  padding: 4rem 1.5rem 4rem;
  text-align: center;
  background: var(--pine);
  color: #f3dfc0;
}
footer .script {
  font-size: 2.6rem;
  color: #e9a45a;
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
  .hero > *,

    opacity: 1 !important;

:root {
  --ivory: #f7f4ed;
  --blush: #ead8d3;
  --rose: #607f77;
  --sage: #345e57;
  --ink: #172b28;
  --gold: #345e57;
  --line: #d8dfd8;
  --pine: #123d38;
  --pine2: #23544c;
  --amber: #74978b;
}
body {
  font-weight: 300;
}
h1,
h2,
h3 {
  letter-spacing: -0.02em;
}
.script {
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
}
.hero {
  height: 100svh;
  min-height: 620px;
  padding: 0;
  position: relative;
  display: block;
  background: var(--pine);
  overflow: hidden;
}
.stick {
  position: relative;
  top: 0;
  height: 100%;
  overflow: hidden;
  background: var(--pine);
}
.hero-photo {
  position: absolute;
  inset: 0;
  overflow: hidden;
}
.hero-photo picture,
.hero-photo img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 47% center;
}
.hero-photo:after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    rgba(7, 35, 33, 0.66),
    rgba(7, 35, 33, 0.12) 75%
  );
}
.hero-copy {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: min(48%, 620px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(2rem, 7vw, 7rem);
  text-align: left;
  background: transparent;
  z-index: 3;
  opacity: 1;
  color: var(--ivory);
}
.hero h1 {
  font-size: clamp(3.2rem, 6.7vw, 7rem);
  line-height: 0.94;
  color: var(--ivory);
  font-weight: 300;
}
.hero h1 span {
  display: block;
}
.hero h1 i {
  font-size: 0.5em;
  color: var(--blush);
  display: block;
  padding: 0.2em 0;
}
.hero .script {
  color: var(--blush);
  font: 300 0.65rem Jost;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-bottom: 2rem;
}
.hero .date {
  font-size: 1.2rem;
  letter-spacing: 0.03em;
  color: var(--ivory);
  margin: 2rem 0 0.5rem;
}
.hero .place {
  font-size: 0.64rem;
  letter-spacing: 0.15em;
  color: #d4e2da;
  line-height: 1.9;
}
.hero .btn {
  border-color: var(--blush);
  color: var(--ivory);
  align-self: flex-start;
  margin-top: 1.5rem;
}
.hero .btn:hover {
  background: var(--blush);
  color: var(--pine);
}
@media (max-width: 700px) {
  .hero {
    height: 100svh;
    min-height: 640px;
  }
  .hero-photo {
    inset: 0;
  }
  .hero-photo img {
    object-position: 50% 43%;
  }
  .hero-photo:after {
    background: linear-gradient(
      180deg,
      rgba(7, 35, 33, 0.08) 35%,
      rgba(7, 35, 33, 0.68)
    );
  }
  .hero-copy {
    top: auto;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: auto;
    min-height: 37%;
    padding: 1rem 1.3rem 2.5rem;
    align-items: center;
    text-align: center;
    justify-content: center;
    background: linear-gradient(transparent, #123d38b8);
  }
  .hero .script {
    display: none;
  }
  .hero h1 {
    font-size: 2.8rem;
    line-height: 1;
  }
  .hero h1 span,
  .hero h1 i {

  .hero .date {
    margin: 0.65rem 0 0.15rem;
    font-size: 0.92rem;

  }
  .hero .place {

    max-width: none;

  }
  .photo-grid img,
  .photo-grid figure:nth-child(even) img {
    width: 100%;
    height: 100%;
    aspect-ratio: auto;
    max-height: none;
    object-fit: cover;
  }
  .gallery {
    padding: 4rem 1rem;
  }
  .gallery-heading {
    display: block;
  }
  .gallery-heading p {
    max-width: none;
  }
  .venue-layout {
    grid-template-columns: 1fr;
    gap: 2rem;
    text-align: center;
  }
  .venue-image {

  }
  .venue-layout .orn {
    justify-content: center;
  }
  #venue {
    padding: 3rem 1rem;
  }
  .count div {
    min-width: 54px;
  }
  .count {
    gap: 0.8rem;
  }
  nav {
    gap: 1rem;
  }
  .pinefall-item {
    opacity: 0.42;
  }
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  .hero {
    height: 100svh;
  }
  .hero-copy {
    opacity: 1 !important;
  }
  .reveal {
    opacity: 1;
    transform: none;
  }
  * {
    animation: none !important;
    transition: none !important;
  }
  .progress {

  .pinefall {

.timeline {

.timeline:before,
.timeline:after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 1px;
}
.timeline:before {
  background: var(--line);

  transform: scaleY(var(--tl));
  transform-origin: top;
  transition: transform 0.35s ease;

  opacity: 0.58;

  transition:

.timeline > div.on {
  opacity: 1;

.timeline div:before {
  background: var(--ivory);

    background 0.35s ease,
    box-shadow 0.35s ease;
}
.timeline div.on:before {
  background: var(--sage);

.pinefall {
  position: fixed;
  inset: 0;
  z-index: 2;
  overflow: hidden;
  pointer-events: none;
}
.pinefall-item {
  position: absolute;
  top: -12vh;
  opacity: 0.52;
  will-change: transform;
  animation: pinefall-drift linear infinite;
  color: #345e57;
}
.pinefall-item.needle {
  width: 22px;
  height: 28px;
}
.pinefall-item.cone {
  width: 17px;
  height: 25px;
  color: #735b37;
}
@keyframes pinefall-drift {
  0% {
    transform: translate3d(0, -10vh, 0) rotate(0deg);
  }
  25% {
    transform: translate3d(28px, 24vh, 0) rotate(75deg);
  }
  50% {
    transform: translate3d(-20px, 52vh, 0) rotate(170deg);
  }
  75% {
    transform: translate3d(28px, 78vh, 0) rotate(255deg);

      '<svg viewBox="0 0 20 28" aria-hidden="true"><defs><linearGradient id="coneShade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a8050"/><stop offset=".48" stop-color="#735b37"/><stop offset="1" stop-color="#51432e"/></linearGradient></defs><path d="M10 1C7 3 5 5 4 8 2 11 2 15 3 19c1 4 3 7 7 9 4-2 6-5 7-9 1-4 1-8-1-11-1-3-3-5-6-7Z" fill="url(#coneShade)" stroke="#51432e" stroke-width=".65"/><g fill="none" stroke="#d3bf92" stroke-opacity=".82" stroke-width=".7" stroke-linecap="round"><path d="M7 5c1.4 1.1 2.3 2.4 3 4 .8-1.6 1.7-2.9 3-4M4.5 9c2.2.5 4 1.8 5.5 3.8 1.5-2 3.3-3.3 5.5-3.8M3.2 14c2.7.2 5 1.5 6.8 3.7 1.8-2.2 4.1-3.5 6.8-3.7M3.8 19c2.5-.1 4.6 1.1 6.2 3.2 1.6-2.1 3.7-3.3 6.2-3.2M6.5 23c1.3-.2 2.5.2 3.5 1.2 1-1 2.2-1.4 3.5-1.2"/></g><path d="M10 1 8.7 4.8" fill="none" stroke="#51432e" stroke-width=".9"/></svg>';
    for (let i = 0; i < 8; i++) {
      const item = document.createElement("span");

      item.className = "pinefall-item " + (isCone ? "cone" : "needle");
      item.innerHTML = isCone ? cone : needle;

  const clamp = (v) => Math.max(0, Math.min(1, v));
  let queued = false;
  function timelineFrame() {
    queued = false;
    const h = document.documentElement.scrollHeight - innerHeight;
    if ($("prog"))
      $("prog").style.transform =
        "scaleX(" + (h > 0 ? clamp(scrollY / h) : 0) + ")";
    const el = $("timeline");
    if (!el) return;
    const box = el.getBoundingClientRect();
    el.style.setProperty(
      "--tl",
      clamp((innerHeight * 0.72 - box.top) / Math.max(1, box.height)),

      .querySelectorAll("#timeline>div")
      .forEach((node) =>
        node.classList.toggle(
          "on",
          node.getBoundingClientRect().top < innerHeight * 0.78,

  addEventListener(
    "scroll",
    () => {
      if (!queued) {
        queued = true;

    { passive: true },

  addEventListener("resize", timelineFrame);
  timelineFrame();
})();;
