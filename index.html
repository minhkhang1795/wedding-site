<style>

/* ---- fall in the pines ---- */
.hero{position:relative;height:270vh;display:block;min-height:0;padding:0;overflow:visible;background:none;text-align:center}

.pL{left:0}.pR{right:0}
.t1{position:absolute;top:6vh;left:0;right:0;padding:0 1rem;z-index:5}

.hero .script{color:var(--rose)}

.hero h1{font-size:clamp(3rem,14vw,7rem);line-height:1;color:var(--ink)}

.hero .date{margin-top:0;font-size:clamp(1.1rem,4vw,1.5rem);color:#f8e3c2}

.leaves{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:15}

nav{background:rgba(251,244,232,.93)}

.reveal{transition:opacity 1s ease,transform 1s ease}

.orn:before,.orn:after{transform:scaleX(0);transition:transform 1.4s .4s ease}.reveal.in .orn:before,.reveal.in .orn:after{transform:scaleX(1)}.orn:before{transform-origin:100% 50%}.orn:after{transform-origin:0 50%}
.card{transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s,border-color .5s;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(217,138,43,.16) 50%,transparent 70%);transform:translateX(-120%);transition:transform .9s}
.reveal.in .card:hover{transform:translateY(-6px);box-shadow:0 22px 44px rgba(120,60,20,.16);border-color:var(--gold)}.card:hover:before{transform:translateX(120%)}
.count{perspective:600px}.count div{text-align:center;background:#fffaf1;border:1px solid var(--line);padding:.8rem .4rem .6rem;min-width:68px;box-shadow:0 8px 20px rgba(120,60,20,.08)}
.count b{color:var(--rose)}.count b.flip{animation:flip .55s}

.timeline{position:relative;border-left:0}

.timeline:after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;margin-left:-.5px;background:linear-gradient(var(--amber),var(--rose));transform:scaleY(var(--tl,0));transform-origin:top}
.timeline div{opacity:.25;transition:opacity .6s,transform .6s}.timeline div.on{opacity:1;transform:none}
.timeline div:before{transition:transform .5s;background:var(--rose);transform:scale(.4)}.timeline div.on:before{transform:scale(1.2);background:var(--amber)}
.btn{position:relative;overflow:hidden;transition:all .4s}.btn:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-130%)}.btn:hover:after{transition:transform .8s;transform:translateX(130%)}.btn:hover{transform:translateY(-2px)}
#venue{position:relative}

.panel{transition:box-shadow .5s}.panel:focus-within{box-shadow:0 26px 60px rgba(181,83,42,.22)}

$('names').innerHTML=C.names[0]+'<i>&amp;</i>'+C.names[1];$('fnames').textContent=C.names.join(" & ");
$('date').textContent=C.dateLine;$('place').textContent=C.venue+" · "+C.place;$('headline').textContent=C.headline;$('intro').textContent=C.intro;
$('vname').textContent=C.venue;$('vtext').textContent=C.venueText;$('map').href=C.mapUrl;$('contact').textContent=C.contact;
$('cards').innerHTML=C.events.map(e=>'<div class="card"><span class="eyebrow">'+e[1]+'</span><h3>'+e[0]+'</h3><p>'+e[2]+'</p></div>').join('');
$('timeline').innerHTML=C.timeline.map(t=>'<div><b>'+t[0]+'</b>'+t[1]+'</div>').join('');
$('travel').innerHTML=C.travel.map(e=>'<div class="card"><h3>'+e[0]+'</h3><p>'+e[1]+'</p></div>').join('');
function tick(){const d=new Date(C.dateISO)-new Date();if(d<0){$('count').innerHTML='';return}
 const v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
 if(!$('count').children.length)$('count').innerHTML=v.map((x,i)=>'<div><b></b><span>'+T.countUnits[i]+'</span></div>').join('');
 [...$('count').children].forEach((el,i)=>{const b=el.firstChild,t=String(v[i]);if(b.textContent!==t){b.textContent=t;b.classList.remove('flip');void b.offsetWidth;b.classList.add('flip')}})}
tick();setInterval(tick,1000);
document.querySelectorAll('[data-to]').forEach(a=>a.onclick=()=>$(a.dataset.to).scrollIntoView({behavior:'smooth'}));
const nav=$('nav');addEventListener('scroll',()=>nav.classList.toggle('show',scrollY>document.getElementById('hero').offsetHeight-window.innerHeight*.6),{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,300)});
const API=window.WEDDING.apiUrl;
function search(){const q=$('q').value.trim();$('none').hidden=true;$('results').innerHTML='';if(q.length<2)return;
 fetch(API+'?action=search&q='+encodeURIComponent(q)).then(r=>r.json()).then(r=>{$('results').innerHTML='';r.results.forEach(g=>{const li=document.createElement('li');li.textContent=g.name;li.onclick=()=>pick(g);$('results').appendChild(li)});
  $('none').textContent=T.noMatch;$('none').hidden=r.results.length>0})
 .catch(()=>{$('none').textContent=T.serverError;$('none').hidden=false})}
function show(id){['step1','step2','done'].forEach(s=>$(s).hidden=s!==id)}
function pick(g){sel=g;show('step2');$('who').textContent=g.name;$('already').hidden=!g.responded;
 $('cnt').innerHTML=Array.from({length:g.max},(_,i)=>'<option>'+(i+1)+'</option>').join('');$('cnt').value=g.max;$('cntwrap').hidden=false}
document.querySelectorAll('[name=att]').forEach(r=>r.onchange=()=>{$('cntwrap').hidden=document.querySelector('[name=att]:checked').value==='no'});
$('back').onclick=()=>show('step1');
$('step2').addEventListener('submit',e=>{e.preventDefault();$('err').hidden=true;$('send').disabled=true;
 const fail=m=>{$('err').textContent=T.genericError+m;$('err').hidden=false;$('send').disabled=false};
 fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({id:sel.id,name:sel.name,attending:document.querySelector('[name=att]:checked').value,count:$('cnt').value,email:$('email').value,notes:$('notes').value})})
 .then(r=>r.json()).then(r=>{if(!r.ok)return fail(r.error);show('done')}).catch(x=>fail(x.message||x))});

// ---- motion (decorative only; no config or RSVP logic below) ----
(function(){
 const rm=matchMedia('(prefers-reduced-motion:reduce)').matches,NS='http://www.w3.org/2000/svg';
 let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 function trees(svg,W,H,n,top,minH,maxH,palette,amberChance,x0,x1){
  seed=7;svg.setAttribute('viewBox','0 0 '+W+' '+H);
  const items=[];for(let i=0;i<n;i++){const h=H*(minH+rnd()*(maxH-minH)),base=H*(top+rnd()*.14);items.push({x:x0+rnd()*(x1-x0),h,base,c:palette[Math.floor(rnd()*palette.length)],am:rnd()<amberChance,c2:rnd()<.5})}
  items.sort((a,b)=>a.base-b.base);let out='';
  for(const t of items){const w=t.h*.34,x=t.x,b=t.base;
   if(t.am){const c=t.c2?'#c9782b':'#a8481f';out+='<rect x="'+(x-4)+'" y="'+(b-t.h*.45)+'" width="8" height="'+t.h*.45+'" fill="#4a2f20"/><circle cx="'+x+'" cy="'+(b-t.h*.55)+'" r="'+w*.5+'" fill="'+c+'"/><circle cx="'+(x-w*.32)+'" cy="'+(b-t.h*.44)+'" r="'+w*.34+'" fill="'+c+'"/><circle cx="'+(x+w*.32)+'" cy="'+(b-t.h*.46)+'" r="'+w*.34+'" fill="#d98a2b"/>';continue}
   out+='<rect x="'+(x-4)+'" y="'+(b-t.h*.1)+'" width="8" height="'+t.h*.12+'" fill="#3a281c"/>';
   for(let k=0;k<5;k++){const ty=b-t.h*.08-k*t.h*.18,tw=w*(1-k*.17);out+='<path d="M'+x+' '+(ty-t.h*.3)+'L'+(x+tw)+' '+ty+'L'+(x-tw)+' '+ty+'Z" fill="'+t.c+'"/>'}}
  svg.innerHTML=out}
 function buildTrees(){const vh=innerHeight,pw=Math.max(240,innerWidth*.62),P=['#1c382b','#244a37','#2f5a43','#173125'];
  trees($('svgL'),pw,vh,Math.round(pw/34),.8,.28,.5,P,.14,-20,pw-70);trees($('svgR'),pw,vh,Math.round(pw/34),.8,.28,.5,P,.14,70,pw+20);
  const v=$('vbg'),vw=v.offsetWidth||innerWidth;trees($('vsvg'),vw,260,Math.round(vw/30),.6,.25,.5,['#1c382b','#2f5a43'],.1,0,vw)}
 buildTrees();let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(buildTrees,200)});
 const couple=[...$('couple').querySelectorAll('path,circle')];couple.forEach(p=>{p.setAttribute('pathLength','1');p.style.strokeDasharray='1';p.style.strokeDashoffset=rm?'0':'1'});
 if(!rm){const lv=$('leaves'),cols=['#c9582a','#d98a2b','#a8481f','#e0a03a','#8c3d1c'];for(let i=0;i<16;i++){const l=document.createElement('span');l.className='leaf';l.style.left=Math.random()*100+'%';l.style.background=cols[i%cols.length];l.style.animationDuration=(12+Math.random()*12)+'s';l.style.animationDelay=(-Math.random()*24)+'s';l.style.width=l.style.height=(10+Math.random()*10)+'px';lv.appendChild(l)}}
 document.querySelectorAll('.reveal').forEach(sec=>{[...sec.children].forEach((c,i)=>c.style.setProperty('--i',i));sec.querySelectorAll('.card,.timeline>div').forEach((c,i)=>c.style.setProperty('--i',i+2))});
 const hero=$('hero'),pL=$('pL'),pR=$('pR'),t2=$('t2'),cue=$('cue'),prog=$('prog'),tl=$('timeline'),tli=[...tl.children],links=[...nav.querySelectorAll('a')],secs=links.map(a=>$(a.dataset.to)),mists=[...document.querySelectorAll('.mist')];
 const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
 let tk=false;
 function frame(){tk=false;const y=scrollY,vh=innerHeight,h=document.documentElement.scrollHeight-vh;prog.style.transform='scaleX('+(h>0?y/h:0)+')';
  const p=rm?1:cl(y/(hero.offsetHeight-vh));
  const tp=ease(cl(p/.6));pL.style.transform='translate3d('+(-tp*108)+'%,0,0)';pR.style.transform='translate3d('+(tp*108)+'%,0,0)';
  const dp=cl((p-.12)/.55);couple.forEach((e,i)=>{e.style.strokeDashoffset=rm?'0':String(1-cl((dp*1.6)-i*.07,0,1))});
  t2.style.opacity=rm?1:cl((p-.62)/.25);t2.style.transform='translateY('+((1-cl((p-.62)/.25))*20)+'px)';cue.style.opacity=cl(1-p*12);
  if(y<vh*3.2){}
  const tr=tl.getBoundingClientRect(),f=cl((vh*.7-tr.top)/tr.height);tl.style.setProperty('--tl',f);tli.forEach(d=>{d.classList.toggle('on',d.getBoundingClientRect().top<vh*.7)});
  mists.forEach(m=>{const r=m.parentElement.getBoundingClientRect();m.style.transform='translate3d('+((r.top-vh/2)*parseFloat(m.dataset.m))+'px,0,0)'});
  let cur=-1;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<vh*.45)cur=i});links.forEach((a,i)=>a.classList.toggle('on',i===cur))}
 addEventListener('scroll',()=>{if(!tk){tk=true;requestAnimationFrame(frame)}},{passive:true});addEventListener('resize',frame);frame();
})();
</script></body></html>
