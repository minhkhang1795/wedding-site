   <input id="q" type="search" autocomplete="off">
   <ul id="results"></ul><p id="none" class="small" hidden></p></div>
  <form id="step2" class="step" hidden>
   <p style="font:400 1.6rem 'Cormorant Garamond',serif;margin:0"><span id="welcomePrefix"></span> <span id="who"></span></p>
   <p class="small" id="already" hidden></p>
   <div class="choice" style="margin-top:1rem"><label><input type="radio" name="att" value="yes" checked> <span id="acceptText"></span></label><label><input type="radio" name="att" value="no"> <span id="declineText"></span></label></div>
   <div id="cntwrap"><label for="cnt" id="countLabel"></label><select id="cnt"></select></div>
   <label for="email" id="emailLabel"></label><input id="email" type="email" required>
   <label for="notes" id="notesLabel"></label><textarea id="notes" rows="3"></textarea>
   <div style="text-align:center"><button class="btn fill" type="submit" id="send"></button><br><button type="button" class="linkbtn small" id="back"></button></div>
   <p class="err" id="err" hidden></p></form>
  <div id="done" class="step done" hidden><h3 id="thanksTitle"></h3><p id="thanksText"></p></div>
 </div></section>
<footer><p class="script" id="fnames"></p><p class="small" id="contact"></p></footer>
<script>
// EDIT THIS CONFIG BLOCK to change the wedding details or any text shown on the site.
// Keep the API URL as-is unless the Apps Script deployment URL changes.
window.WEDDING={
 apiUrl:"https://script.google.com/macros/s/AKfycbxiy6zhKInn70xzM6M52AmYpQTrusa5lkmekYNRXVZiiMkWH3vZ8o8x7EJg3uUCIhsd/exec",
 names:["Khang","Thuy"],
 dateLine:"Saturday, April 3, 2027", dateISO:"2027-04-03T16:00:00+07:00",
 place:"Dalat, Vietnam",
 headline:"We're getting married",
 intro:"From the energy of New York to the quiet charm of Da Lat.",
 events:[["Ceremony","4:00 PM","Garden ceremony at the villas"],["Reception","6:00 PM","Dinner, toasts and dancing"]],
 timeline:[["3:30 PM","Guests arrive"],["4:00 PM","Ceremony"],["5:00 PM","Cocktails in the gardens"],["6:00 PM","Dinner and reception"],["9:00 PM","Dancing under the stars"]],
 venue:"Ana Mandara Villas Dalat Resort & Spa",
 venueText:"A sanctuary of restored 1920s French colonial villas, preserving the charm, craftsmanship, and historic elegance of old-world Indochina.",
 mapUrl:"https://www.google.com/maps/search/?api=1&query=Ana+Mandara+Villas+Dalat+Resort+%26+Spa",
 travel:[["Getting there","By Air: Fly into Lien Khuong Airport (DLI) (~40 mins to the resort).<br>By Road: Accessible via scenic drive or sleeper bus from Ho Chi Minh City."]],
 contact:"Questions? Email us at vuminhkhang1995@gmail.com",
 // Wedding photos are stored as static files in assets/.
 // PHOTO SLOTS: replace these URLs or replace the matching assets files.
 // heroDesktop = wide smiling portrait; heroMobile = full-length vertical portrait.
 photos:{heroDesktop:"assets/03.svg",heroMobile:"assets/04.svg",venue:"assets/villa.jpg",gallery:[
  {src:"assets/01.svg",alt:"Khang and Thuy embracing beside a garden pond",width:1680,height:1120},
  {src:"assets/02.svg",alt:"Khang and Thuy holding hands outside the NYC subway",width:1400,height:2100},
  {src:"assets/03.svg",alt:"Khang and Thuy smiling beside a teal NYC doorway",width:1680,height:1120},
  {src:"assets/04.svg",alt:"Khang and Thuy in wedding attire, bouquet raised",width:1400,height:2100}]},
 text:{
  forestEyebrow:"A celebration among the pines", forestPlace:"New York hearts · Dalat pines",scrollCue:"Scroll to begin",
  galleryEyebrow:"Together, everywhere",galleryTitle:"A little of us",galleryText:"From the streets of New York to the pines of Dalat. We can't wait to celebrate with you.",
  navStory:"Us", navDetails:"Details", navVenue:"Venue", navRsvp:"RSVP",
  heroTagline:"Together with their families", heroButton:"RSVP",
  storyEyebrow:"Save the date", detailsEyebrow:"The celebration", detailsTitle:"Details",
  venueEyebrow:"Where", mapLink:"View on Google Maps",
  rsvpEyebrow:"Kindly reply", rsvpTitle:"RSVP", searchLabel:"Search your name",
  searchPlaceholder:"Type your first or last name", noMatch:"No match. Try just your first or last name, or contact us below.",
  serverError:"Could not reach the server. Please try again.", welcomePrefix:"Welcome,",
  already:"You already replied. Submitting again will update your answer.",
  acceptText:"Joyfully accepts", declineText:"Regretfully declines",
  countLabel:"Guests attending (including you)", emailLabel:"Email address", emailPlaceholder:"vuminhkhang1995@gmail.com",
  notesLabel:"Dietary needs or a note (optional)", send:"Send RSVP", back:"Not you? Search again",
  thanksTitle:"Thank you", thanksText:"Your RSVP is in. We'll email you the details soon.",
  genericError:"Something went wrong: ", countUnits:["Days","Hours","Minutes","Seconds"]
 }
};
const C=window.WEDDING,$=id=>document.getElementById(id);let sel=null,timer;
const T=C.text;
for(const id of ["navStory","navDetails","navVenue","navRsvp","heroTagline","heroButton","storyEyebrow","detailsEyebrow","detailsTitle","venueEyebrow","rsvpEyebrow","rsvpTitle","searchLabel","welcomePrefix","acceptText","declineText","countLabel","emailLabel","notesLabel","send","back","thanksTitle","thanksText"]){$(id).textContent=T[id]}
$('already').textContent=T.already;$('map').textContent=T.mapLink;$('q').placeholder=T.searchPlaceholder;$('email').placeholder=T.emailPlaceholder;
document.title=C.names.join(" & ")+" - Wedding";
$('names').innerHTML='<span>'+C.names[0]+'</span><i>&amp;</i><span>'+C.names[1]+'</span>';$('fnames').textContent=C.names.join(" & ");
$('date').textContent=C.dateLine;$('place').textContent=C.venue+" · "+C.place;$('headline').textContent=C.headline;$('intro').textContent=C.intro;
$('vname').textContent=C.venue;$('vtext').textContent=C.venueText;$('map').href=C.mapUrl;$('contact').textContent=C.contact;
$('cards').innerHTML=C.events.map(e=>'<div class="card"><span class="eyebrow">'+e[1]+'</span><h3>'+e[0]+'</h3><p>'+e[2]+'</p></div>').join('');
$('timeline').innerHTML=C.timeline.map(t=>'<div><b>'+t[0]+'</b>'+t[1]+'</div>').join('');
$('travel').innerHTML=C.travel.map(e=>'<div class="card"><h3>'+e[0]+'</h3><p>'+e[1]+'</p></div>').join('');
$('heroPhoto').src=C.photos.heroDesktop;$('heroPhoto').alt=C.photos.gallery[2].alt;$('heroMobile').srcset=C.photos.heroMobile;
$('venuePhoto').src=C.photos.venue;$('venuePhoto').alt='Ana Mandara Villas Dalat Resort beneath the pine hills';
$('photoGrid').innerHTML=C.photos.gallery.map(p=>'<figure><img src="'+p.src+'" alt="'+p.alt+'" width="'+p.width+'" height="'+p.height+'" loading="lazy" decoding="async"></figure>').join('');
['forestEyebrow','forestPlace','galleryEyebrow','galleryTitle','galleryText'].forEach(id=>$(id).textContent=T[id]);$('forestNames').textContent=C.names.join(' & ');$('cue').textContent=T.scrollCue;
function tick(){const d=new Date(C.dateISO)-new Date();if(d<0){$('count').innerHTML='';return}
 const v=[Math.floor(d/864e5),Math.floor(d/36e5)%24,Math.floor(d/6e4)%60,Math.floor(d/1e3)%60];
 if(!$('count').children.length)$('count').innerHTML=v.map((x,i)=>'<div><b></b><span>'+T.countUnits[i]+'</span></div>').join('');
 [...$('count').children].forEach((el,i)=>{const b=el.firstChild,t=String(v[i]);if(b.textContent!==t){b.textContent=t;b.classList.remove('flip');void b.offsetWidth;b.classList.add('flip')}})}
tick();setInterval(tick,1000);
document.querySelectorAll('[data-to]').forEach(a=>a.onclick=()=>$(a.dataset.to).scrollIntoView({behavior:'smooth'}));
const nav=$('nav');addEventListener('scroll',()=>nav.classList.toggle('show',scrollY>document.getElementById('hero').offsetHeight-window.innerHeight*.6),{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,300)});
const API=window.WEDDING.apiUrl;
function search(){const q=$('q').value.trim();$('none').hidden=true;$('results').innerHTML='';if(q.length<2)return;
 fetch(API+'?action=search&q='+encodeURIComponent(q)).then(r=>r.json()).then(r=>{$('results').innerHTML='';r.results.forEach(g=>{const li=document.createElement('li');li.textContent=g.name;li.onclick=()=>pick(g);$('results').appendChild(li)});
  $('none').textContent=T.noMatch;$('none').hidden=r.results.length>0})
 .catch(()=>{$('none').textContent=T.serverError;$('none').hidden=false})}
function show(id){['step1','step2','done'].forEach(s=>$(s).hidden=s!==id)}
function pick(g){sel=g;show('step2');$('who').textContent=g.name;$('already').hidden=!g.responded;
 $('cnt').innerHTML=Array.from({length:g.max},(_,i)=>'<option>'+(i+1)+'</option>').join('');$('cnt').value=g.max;$('cntwrap').hidden=false}
document.querySelectorAll('[name=att]').forEach(r=>r.onchange=()=>{$('cntwrap').hidden=document.querySelector('[name=att]:checked').value==='no'});
$('back').onclick=()=>show('step1');
$('step2').addEventListener('submit',e=>{e.preventDefault();$('err').hidden=true;$('send').disabled=true;
 const fail=m=>{$('err').textContent=T.genericError+m;$('err').hidden=false;$('send').disabled=false};
 fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({id:sel.id,name:sel.name,attending:document.querySelector('[name=att]:checked').value,count:$('cnt').value,email:$('email').value,notes:$('notes').value})})
 .then(r=>r.json()).then(r=>{if(!r.ok)return fail(r.error);show('done')}).catch(x=>fail(x.message||x))});

// Approved curtain entrance and restrained evergreen fall. RSVP handlers above are unchanged.
(function(){
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const curtain=$('curtain');let curtainStarted=false;
function startCurtain(){if(reduced||!curtain||curtainStarted)return;curtainStarted=true;
 // CSS starts the animation without waiting for JS. Keep a JS watchdog as a second exit path.
 const panel=curtain.querySelector('.curtain-left');
 panel.addEventListener('animationend',e=>{if(e.target===panel)curtain.remove()},{once:true});
 setTimeout(()=>{if(curtain.isConnected)curtain.remove()},6500);
}
if(!reduced&&curtain){
 startCurtain();addEventListener('pageshow',startCurtain,{once:true});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)startCurtain()});
 curtain.addEventListener('pointerdown',startCurtain,{once:true});curtain.addEventListener('touchstart',startCurtain,{once:true,passive:true});
}
if(!reduced){const layer=$('pinefall');const needle='<svg viewBox="0 0 24 30" aria-hidden="true"><path d="M12 28 4 18l7 3-6-8 7 3-4-8 4 4 1-9 2 9 5-5-3 9 5-3-6 8 6-2-8 9Z" fill="currentColor"/><path d="M12 28V5" stroke="#f7f4ed" stroke-opacity=".7" stroke-width=".8"/></svg>';const cone='<svg viewBox="0 0 20 28" aria-hidden="true"><path d="M10 1C5 5 3 10 3 16c0 6 3 10 7 11 4-1 7-5 7-11 0-6-2-11-7-15Z" fill="currentColor"/><path d="M6 8l8 2M4 13l12 2M5 18l10 2M8 23l5 1" fill="none" stroke="#f7f4ed" stroke-width="1" stroke-opacity=".8"/><path d="M10 1 8 5" stroke="#345e57" stroke-width="1.3"/></svg>';for(let i=0;i<8;i++){const item=document.createElement('span');const isCone=i%3===0;item.className='pinefall-item '+(isCone?'cone':'needle');item.innerHTML=isCone?cone:needle;item.style.left=(6+Math.random()*88)+'%';item.style.animationDuration=(20+Math.random()*14)+'s';item.style.animationDelay=(-Math.random()*30)+'s';item.style.transform='rotate('+(Math.random()*360)+'deg)';layer.appendChild(item)}}
const clamp=v=>Math.max(0,Math.min(1,v));let queued=false;function timelineFrame(){queued=false;const el=$('timeline');if(!el)return;const box=el.getBoundingClientRect();el.style.setProperty('--tl',clamp((innerHeight*.72-box.top)/Math.max(1,box.height)));document.querySelectorAll('#timeline>div').forEach(node=>node.classList.toggle('on',node.getBoundingClientRect().top<innerHeight*.78))}addEventListener('scroll',()=>{if(!queued){queued=true;requestAnimationFrame(timelineFrame)}},{passive:true});addEventListener('resize',timelineFrame);timelineFrame();
})();
</script></body></html>
